name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify deployable artifact
        # Defensive: refuse to deploy if /investigacion-source or any non-public path leaked.
        run: |
          echo "=== Top of public/ ==="
          ls public/
          echo "---"
          if find public -type d -name "investigacion*" 2>/dev/null | grep -q .; then
            echo "ERROR: investigacion path leaked into public/. Aborting."
            exit 1
          fi
          if find public -name "_originals" -o -name "investigacion-source" 2>/dev/null | grep -q .; then
            echo "ERROR: source artefacts in public/. Aborting."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
